<svg width="680" height="790" viewBox="0 0 680 790" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The Boundary Atlas, figure 2: the verification ceremony — sequence with the second missing arrow</title>
<desc>A sequence diagram with three lifelines: holder with a wallet on the device, verifier with policy decision and enforcement points, and an issuer marked absent by design. The holder arrives with credentials held in custody. Eight numbered steps: a fresh verifier-issued challenge, bound to verifier domain and transaction intent, that also serves as the attempt identifier; holder-side derivation of a qualified unlinkable presentation, or selection of a qualified per-use credential, both bound to that challenge; presentation of an attestation with no other declared cargo, while the checkpoint observes transport metadata under rule nine; verification of binding and cryptographic proof, whose rejections are recorded as deny or indeterminate, followed by local checks against the last-known-good snapshot under FP-1 max-ages; a candidate three-valued decision of allow, deny, or indeterminate; one atomic commit keyed to the attempt identifier that binds exactly one unit with its state, the immutable outcome, and the regional evidence record before any enforcement, at-most-once per verifier domain, where unconfirmed commit or evidence never allows; idempotent attempt-keyed enforcement where a final allow is returned only after the effect is confirmed and an unknown effect never allows; and a coarse result with retry conditions, correlator-free, with the evidence contract for successes and failures handed to figure 4. One dashed crossed arrow marks that the verifier sends no per-ceremony callback or event to the issuer.</desc>
<style>
text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.th { font-size: 14px; font-weight: 500; }
.box { fill: #FFFFFF; stroke: #888780; }
.arr { stroke: #5F5E5A; fill: none; stroke-width: 1.5; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.c-coral > rect { fill: #FAECE7; stroke: #993C1D; } .c-coral > .th { fill: #712B13; } .c-coral > .ts { fill: #993C1D; }
.ghost > rect { fill: #FFFFFF; stroke: #888780; } .ghost > .th { fill: #5F5E5A; } .ghost > .ts { fill: #5F5E5A; }
.ok { fill: #3B6D11; } .no { fill: #A32D2D; } .cond { fill: #854F0B; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="790" fill="#FFFFFF"/>

<line x1="180" y1="96" x2="180" y2="700" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="450" y1="96" x2="450" y2="700" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="590" y1="96" x2="590" y2="700" stroke="#888780" stroke-width="1" stroke-dasharray="2 5"/>

<g class="c-purple">
<rect x="100" y="40" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="58" text-anchor="middle" dominant-baseline="central">Holder</text>
<text class="ts" x="180" y="76" text-anchor="middle" dominant-baseline="central">wallet on device</text>
</g>
<g class="c-coral">
<rect x="370" y="40" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="450" y="58" text-anchor="middle" dominant-baseline="central">Verifier</text>
<text class="ts" x="450" y="76" text-anchor="middle" dominant-baseline="central">PDP / PEP</text>
</g>
<g class="ghost">
<rect x="540" y="40" width="100" height="56" rx="8" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="590" y="58" text-anchor="middle" dominant-baseline="central">Issuer</text>
<text class="ts" x="590" y="76" text-anchor="middle" dominant-baseline="central">(absent)</text>
</g>

<g>
<rect class="box" x="40" y="112" width="280" height="32" rx="6" stroke-width="0.5"/>
<text class="ts" x="180" y="122" text-anchor="middle" dominant-baseline="central">arrives with credentials</text>
<text class="ts" x="180" y="136" text-anchor="middle" dominant-baseline="central">held in the holder's custody</text>
</g>

<text class="ts" x="315" y="160" text-anchor="middle" dominant-baseline="central">1 · fresh challenge = attempt ID</text>
<text class="ts" x="315" y="174" text-anchor="middle" dominant-baseline="central">bound to this domain + intent</text>
<line x1="444" y1="186" x2="188" y2="186" class="arr" marker-end="url(#arrow)"/>

<g>
<rect class="box" x="40" y="206" width="280" height="46" rx="6" stroke-width="0.5"/>
<text class="ts" x="180" y="216" text-anchor="middle" dominant-baseline="central">2 · unlinkable presentation derived</text>
<text class="ts" x="180" y="230" text-anchor="middle" dominant-baseline="central">or per-use credential selected</text>
<text class="ts" x="180" y="244" text-anchor="middle" dominant-baseline="central">both bound to this challenge</text>
</g>

<text class="ts" x="315" y="272" text-anchor="middle" dominant-baseline="central">3 · presents the attestation</text>
<text class="ts" x="315" y="286" text-anchor="middle" dominant-baseline="central">no other declared cargo</text>
<line x1="186" y1="298" x2="442" y2="298" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="315" y="316" text-anchor="middle" dominant-baseline="central"><tspan class="cond">obs</tspan>: transport metadata · rule 9</text>

<g>
<rect class="box" x="330" y="336" width="240" height="46" rx="6" stroke-width="0.5"/>
<text class="ts" x="450" y="346" text-anchor="middle" dominant-baseline="central">4 · verifies binding &amp; proof</text>
<text class="ts" x="450" y="360" text-anchor="middle" dominant-baseline="central">then LKG check under FP-1</text>
<text class="ts" x="450" y="374" text-anchor="middle" dominant-baseline="central">rejection is recorded, no allow</text>
</g>

<text class="ts" x="462" y="400" dominant-baseline="central"><tspan class="no">✕</tspan> no callback</text>
<line x1="456" y1="414" x2="584" y2="414" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<g>
<rect class="box" x="330" y="434" width="240" height="32" rx="6" stroke-width="0.5"/>
<text class="ts" x="450" y="444" text-anchor="middle" dominant-baseline="central">5 · candidate decision</text>
<text class="ts" x="450" y="458" text-anchor="middle" dominant-baseline="central"><tspan class="ok">allow</tspan> · <tspan class="no">deny</tspan> · <tspan class="cond">indeterminate</tspan></text>
</g>

<g>
<rect class="box" x="330" y="478" width="240" height="46" rx="6" stroke-width="0.5"/>
<text class="ts" x="450" y="488" text-anchor="middle" dominant-baseline="central">6 · one atomic commit</text>
<text class="ts" x="450" y="502" text-anchor="middle" dominant-baseline="central">attempt ID · one unit only</text>
<text class="ts" x="450" y="516" text-anchor="middle" dominant-baseline="central">outcome + regional evidence</text>
</g>

<g>
<rect class="box" x="330" y="536" width="240" height="46" rx="6" stroke-width="0.5"/>
<text class="ts" x="450" y="546" text-anchor="middle" dominant-baseline="central">7 · enforce once, idempotent</text>
<text class="ts" x="450" y="560" text-anchor="middle" dominant-baseline="central">confirmed effect → final allow</text>
<text class="ts" x="450" y="574" text-anchor="middle" dominant-baseline="central">unknown effect → no allow</text>
</g>

<text class="ts" x="315" y="598" text-anchor="middle" dominant-baseline="central">8 · result: coarse, retry terms</text>
<text class="ts" x="315" y="612" text-anchor="middle" dominant-baseline="central">correlator-free</text>
<line x1="444" y1="624" x2="188" y2="624" class="arr" marker-end="url(#arrow)"/>

<g>
<rect class="box" x="330" y="644" width="240" height="46" rx="6" stroke-width="0.5"/>
<text class="ts" x="450" y="654" text-anchor="middle" dominant-baseline="central">evidence contract → figure 4</text>
<text class="ts" x="450" y="668" text-anchor="middle" dominant-baseline="central">successes, failures, journal</text>
<text class="ts" x="450" y="682" text-anchor="middle" dominant-baseline="central">regional operators &amp; auditors</text>
</g>

<text class="ts" x="40" y="718" dominant-baseline="central">One presentation crosses; obs under rule 9; no ceremony reaches the issuer.</text>
