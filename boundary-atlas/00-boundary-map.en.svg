<svg width="680" height="754" viewBox="0 0 680 754" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The Boundary Atlas, figure 0: boundary map for minimal-disclosure identity across a fragmented supply chain</title>
<desc>A holder retains custody of originals above two symmetric regional cells. Each cell contains an issuer, a verifier with policy decision and enforcement points, a regional trust registry that owns metadata sync and holds a last-known-good snapshot, and a supply chain data plane. Decision results return to the holder correlator-free. A thin federation interface below syncs only trust anchors, revocation data, and policy. No arrow in the diagram carries raw PII.</desc>
<style>
text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #2C2C2A; }
.t { font-size: 14px; } .th { font-size: 14px; font-weight: 500; } .ts { font-size: 12px; fill: #5F5E5A; }
.box { fill: #FFFFFF; stroke: #888780; }
.arr { stroke: #5F5E5A; fill: none; stroke-width: 1.5; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; } .c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="754" fill="#FFFFFF"/>

<g class="c-purple">
<rect x="200" y="40" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Holder (person or business)</text>
<text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">Retains custody of originals</text>
</g>

<path d="M185 150 L185 118 L270 118 L270 106" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="134" dominant-baseline="central">Issue — credential</text>
<path d="M410 98 L410 118 L495 118 L495 140" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="418" y="108" dominant-baseline="central">Present — attestation</text>
<path d="M585 150 L585 68 L490 68" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="593" y="110" dominant-baseline="central">Result</text>

<g class="c-teal">
<rect x="40" y="150" width="290" height="330" rx="16" stroke-width="0.5"/>
<text class="th" x="185" y="178" text-anchor="middle" dominant-baseline="central">Regional cell A (e.g. EU)</text>
<text class="ts" x="185" y="196" text-anchor="middle" dominant-baseline="central">Operates locally during a partition</text>
</g>
<g>
<rect class="box" x="60" y="210" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="228" text-anchor="middle" dominant-baseline="central">Issuer</text>
<text class="ts" x="185" y="246" text-anchor="middle" dominant-baseline="central">Government / industry authority</text>
</g>
<g>
<rect class="box" x="60" y="276" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="294" text-anchor="middle" dominant-baseline="central">Verifier (PDP / PEP)</text>
<text class="ts" x="185" y="312" text-anchor="middle" dominant-baseline="central">Receives attestations only</text>
</g>
<g>
<rect class="box" x="60" y="342" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="360" text-anchor="middle" dominant-baseline="central">Trust registry — sync owner</text>
<text class="ts" x="185" y="378" text-anchor="middle" dominant-baseline="central">Validates &amp; holds LKG snapshot</text>
</g>
<g>
<rect class="box" x="60" y="408" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="426" text-anchor="middle" dominant-baseline="central">Supply chain data plane</text>
<text class="ts" x="185" y="444" text-anchor="middle" dominant-baseline="central">Regional data stays regional</text>
</g>

<g class="c-teal">
<rect x="350" y="150" width="290" height="330" rx="16" stroke-width="0.5"/>
<text class="th" x="495" y="178" text-anchor="middle" dominant-baseline="central">Regional cell B (e.g. ASEAN)</text>
<text class="ts" x="495" y="196" text-anchor="middle" dominant-baseline="central">Operates locally during a partition</text>
</g>
<g>
<rect class="box" x="370" y="210" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="228" text-anchor="middle" dominant-baseline="central">Issuer</text>
<text class="ts" x="495" y="246" text-anchor="middle" dominant-baseline="central">Government / industry authority</text>
</g>
<g>
<rect class="box" x="370" y="276" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="294" text-anchor="middle" dominant-baseline="central">Verifier (PDP / PEP)</text>
<text class="ts" x="495" y="312" text-anchor="middle" dominant-baseline="central">Receives attestations only</text>
</g>
<g>
<rect class="box" x="370" y="342" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="360" text-anchor="middle" dominant-baseline="central">Trust registry — sync owner</text>
<text class="ts" x="495" y="378" text-anchor="middle" dominant-baseline="central">Validates &amp; holds LKG snapshot</text>
</g>
<g>
<rect class="box" x="370" y="408" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="426" text-anchor="middle" dominant-baseline="central">Supply chain data plane</text>
<text class="ts" x="495" y="444" text-anchor="middle" dominant-baseline="central">Regional data stays regional</text>
</g>

<line x1="185" y1="484" x2="185" y2="508" class="arr" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="495" y1="484" x2="495" y2="508" class="arr" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="40" y="514" width="600" height="72" rx="12" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="340" y="536" text-anchor="middle" dominant-baseline="central">Federation interface</text>
<text class="ts" x="340" y="554" text-anchor="middle" dominant-baseline="central">A sync contract, not a runtime service</text>
<text class="ts" x="340" y="570" text-anchor="middle" dominant-baseline="central">Cross-border cargo: trust anchors, revocation data, policy</text>
</g>

<line x1="40" y1="610" x2="66" y2="610" class="arr"/>
<text class="ts" x="74" y="610" dominant-baseline="central">Issue = credential → holder · Present = attestation → verifier</text>
<line x1="40" y1="634" x2="66" y2="634" class="arr"/>
<text class="ts" x="74" y="634" dominant-baseline="central">Result = allow / deny / indeterminate → holder, correlator-free</text>
<line x1="40" y1="658" x2="66" y2="658" class="arr" stroke-dasharray="4 3"/>
<text class="ts" x="74" y="658" dominant-baseline="central">Cross-region sync = listed metadata only · arrows show example paths</text>
<text class="ts" x="40" y="682" dominant-baseline="central">No arrow here carries raw PII or source documents — the absence is the design.</text>
