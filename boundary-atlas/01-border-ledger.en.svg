<svg width="680" height="1050" viewBox="0 0 680 1050" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The Boundary Atlas, figure 1: the border ledger — data classes against exchange paths and residency</title>
<desc>A matrix of thirteen data classes against four exchange paths (issue, present, result, federation sync) and one residency constraint asking whether data may leave its origin region — the region where it was issued, generated, or observed. Identity artifacts split into three mutually exclusive leaves under a versioned discriminator: reusable source credential, qualified per-use credential, and qualified unlinkable presentation. Every presentation-capable leaf is gated under rule ten, which references the figure 0 binding gate; ceremony and anti-replay mechanics are reserved under control SU-1 to figures 2 and 4. Reusable credentials never cross the Present lane. No system lane carries raw PII or biometric reference data; they leave their origin region only in the holder's custody. Unlinkable presentations are derived by the holder during the local ceremony; remote cross-region presentation is not adopted. Checkpoint time, location, and network metadata carry a distinct observation verdict, obs, under rule nine. Status data, trust anchors, and policy cross only signed, versioned, unexpired, and validated with max-age per freshness policy FP-1. Operational telemetry has no permitted crossing in the initial ledger. Business data carries a dash for governance outside this ledger. The predicate register shows one fully specified active entry and inactive candidates that cross nothing. The ledger's own epoch and approval gates appear below the matrix. Every cell holds an explicit verdict; there are no blank cells.</desc>
