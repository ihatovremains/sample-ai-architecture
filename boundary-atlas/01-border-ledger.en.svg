<text class="ts" x="40" y="706" dominant-baseline="central">⁸ governed outside this ledger by an external trade-compliance policy and its owner</text>
<text class="ts" x="40" y="726" dominant-baseline="central">⁹ regional-only, per-verifier, purpose-limited; no stable subject key; never joined</text>
<text class="ts" x="40" y="746" dominant-baseline="central">¹⁰ qualified by the figure 0 binding gate; ceremony and anti-replay mechanics per SU-1</text>

<text class="ts" x="40" y="774" dominant-baseline="central">Predicate register — active: age_over_18 = age ≥ 18 at presentation time</text>
<text class="ts" x="40" y="794" dominant-baseline="central">authority: regional ID issuer · legal jurisdiction: EU · v1 · freshness ≤ 24 h</text>
<text class="ts" x="40" y="814" dominant-baseline="central">purpose: age-gated release of goods</text>
<text class="ts" x="40" y="834" dominant-baseline="central">candidates (inactive, cross nothing): sanctions_clear · licensed_importer</text>
<text class="ts" x="40" y="854" dominant-baseline="central">Freshness policy FP-1: trust anchors ≤ 7 d · status data ≤ 24 h · policy ≤ 7 d</text>
<text class="ts" x="40" y="874" dominant-baseline="central">Channel owners: time / place → regional checkpoint operator</text>
<text class="ts" x="40" y="894" dominant-baseline="central">network / device → regional platform operator · biometrics → holder (device-enforced)</text>
<text class="ts" x="40" y="914" dominant-baseline="central">business identifiers → supply chain data plane owner</text>
<text class="ts" x="40" y="934" dominant-baseline="central">This ledger: epoch 1 · signed by its approval authority · hash recorded at release</text>
<text class="ts" x="40" y="954" dominant-baseline="central">Approval gates: legal · compliance · data governance · architecture &amp; security</text>

<text class="ts" x="40" y="982" dominant-baseline="central">A blank cell is not a decision — this ledger has no blank cells.</text>
